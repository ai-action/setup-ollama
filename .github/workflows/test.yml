name: test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests
        run: npm run test:ci

      - name: Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run action
        uses: ./

      - name: Get version
        run: ollama --version

      - name: Show help
        run: ollama --help

  # action should work on a clean machine without building
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [0.13.5, latest]
    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version
        if: matrix.version == 'latest'
        shell: bash
        run: echo "VERSION=$(awk '/default:/{print $2; exit}' action.yml)" >> "$GITHUB_ENV"

      - name: Cache ollama
        uses: actions/cache@v5
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama

      - name: Run action
        uses: ./
        with:
          version: ${{ env.VERSION }}
          name: ollama-cli

      - name: Locate binary
        run: command -v ollama-cli

      - name: Check version
        shell: bash
        run: |
          if [[ "$(ollama-cli --version)" != *'${{ env.VERSION }}'* ]]; then
            echo 'Version does not match. See version below:'
            ollama-cli --version
            exit 1
          fi

      - name: Pull model
        shell: bash
        run: ollama-cli pull qwen2.5:0.5b

      - name: Run model
        shell: bash
        run: |
          output=$(ollama-cli run qwen2.5:0.5b 'What model are you?')
          printf '%s\n' "$output"
          test -n "$output"
